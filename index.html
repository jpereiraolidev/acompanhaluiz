<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="capa.png">
  <link rel="apple-touch-icon" href="capa.png">
  <title>Diário · Entrar</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --primary: #8b5cf6;
      --primary-light: #a78bfa;
      --primary-dark: #7c3aed;
      --primary-glow: rgba(139, 92, 246, 0.25);

      --success: #22c55e;
      --danger: #ef4444;
      --info: #38bdf8;
    }

    html[data-theme="dark"] {
      --bg: #0a0a0f; --bg-2: #12121a;
      --card: #16161f; --card-hover: #1c1c28;
      --border: #262633; --border-soft: #1f1f2b;
      --text: #f5f5f7; --text-2: #b8b8c8; --text-3: #6b6b7e;
      --input-bg: #0a0a0f;
      --backdrop: rgba(0,0,0,0.6);
    }
    html[data-theme="light"] {
      --bg: #f5f5f7; --bg-2: #ebebef;
      --card: #ffffff; --card-hover: #f0f0f4;
      --border: #d4d4dc; --border-soft: #e4e4ea;
      --text: #0f0f14; --text-2: #4a4a58; --text-3: #8a8a98;
      --input-bg: #f0f0f4;
      --backdrop: rgba(0,0,0,0.35);
    }
    html[data-theme="glass"] {
      --bg: #0b0b14; --bg-2: rgba(255,255,255,0.03);
      --card: rgba(255,255,255,0.06); --card-hover: rgba(255,255,255,0.10);
      --border: rgba(255,255,255,0.12); --border-soft: rgba(255,255,255,0.07);
      --text: #ffffff; --text-2: rgba(255,255,255,0.75); --text-3: rgba(255,255,255,0.45);
      --input-bg: rgba(255,255,255,0.05);
      --backdrop: rgba(0,0,0,0.5);
    }

    html[data-theme="glass"] body::before,
    html[data-theme="glass"] body::after {
      content: ''; position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.55; pointer-events: none; z-index: 0;
    }
    html[data-theme="glass"] body::before {
      width: 420px; height: 420px; top: -120px; left: -120px;
      background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      animation: orbFloat 18s ease-in-out infinite;
    }
    html[data-theme="glass"] body::after {
      width: 380px; height: 380px; bottom: -120px; right: -120px;
      background: radial-gradient(circle, #38bdf8 0%, transparent 70%);
      animation: orbFloat 22s ease-in-out infinite reverse;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(40px,30px) scale(1.15); }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 15px; line-height: 1.5; overscroll-behavior-y: none;
      transition: background 0.4s ease, color 0.4s ease;
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(ellipse at top, rgba(139, 92, 246, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse at bottom right, rgba(56, 189, 248, 0.05) 0%, transparent 50%),
        var(--bg);
    }
    html[data-theme="light"] body {
      background:
        radial-gradient(ellipse at top, rgba(139, 92, 246, 0.07) 0%, transparent 55%),
        var(--bg);
    }
    html[data-theme="glass"] body { background: var(--bg); }

    .auth-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      position: relative; z-index: 1;
    }

    .auth-card {
      width: 100%; max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      animation: fadeUp 0.4s ease;
    }
    html[data-theme="glass"] .auth-card {
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 24px; }
    .brand-icon {
      width: 62px; height: 62px; border-radius: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px var(--primary-glow); margin-bottom: 14px;
    }
    .brand-icon svg { width: 30px; height: 30px; stroke: #fff; stroke-width: 2.2; }
    .brand h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
    .brand p { margin: 0; font-size: 13px; color: var(--text-3); }

    .tabs {
      display: flex; gap: 4px;
      background: var(--bg-2); border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm); padding: 4px; margin-bottom: 22px;
    }
    .tab-btn {
      flex: 1; padding: 10px 8px;
      background: transparent; border: none; border-radius: 8px;
      font-family: inherit; font-size: 13.5px; font-weight: 700;
      color: var(--text-3); cursor: pointer; transition: all 0.2s ease;
      position: relative; z-index: 1;
    }
    .tab-btn.active { color: var(--text); background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

    .form { display: none; animation: fadeUp 0.3s ease; }
    .form.active { display: block; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11px; color: var(--text-3);
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 13px 14px;
      background: var(--input-bg); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 15px; color: var(--text);
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      -webkit-appearance: none; appearance: none;
    }
    .field input:focus {
      outline: none; border-color: var(--primary);
      background: var(--card); box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .field input::placeholder { color: var(--text-3); }

    .field-error {
      display: none; font-size: 11.5px; color: var(--danger);
      margin-top: 5px; font-weight: 600;
    }
    .field.error input { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }
    .field.error .field-error { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .field.shake { animation: shake 0.4s ease; }

    .btn-primary {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff; border: none; padding: 15px;
      border-radius: var(--radius-sm); font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: all 0.15s ease;
      box-shadow: 0 4px 16px var(--primary-glow);
      letter-spacing: -0.01em; margin-top: 6px;
    }
    .btn-primary svg { width: 18px; height: 18px; stroke-width: 2.4; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-primary .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; bottom: calc(24px + var(--safe-bottom));
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff; padding: 12px 20px; border-radius: 100px;
      font-size: 13.5px; font-weight: 700;
      opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 20px var(--primary-glow);
      display: flex; align-items: center; gap: 8px;
      max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast svg { width: 16px; height: 16px; stroke-width: 2.5; flex-shrink: 0; }
    .toast.error { background: linear-gradient(135deg, var(--danger) 0%, #b91c1c 100%); box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 20px rgba(239, 68, 68, 0.35); }
    .toast span { white-space: normal; }

    .auth-footer {
      margin-top: 20px; text-align: center;
      font-size: 12px; color: var(--text-3);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .theme-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-3); font-family: inherit;
      font-size: 11.5px; font-weight: 700;
      padding: 5px 10px; border-radius: 100px;
      cursor: pointer; transition: all 0.15s;
    }
    .theme-btn:active { transform: scale(0.95); }
    .theme-btn svg { width: 13px; height: 13px; stroke-width: 2.4; }

    .checking {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--text-3); font-size: 13px;
    }
    .checking .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="auth-wrap">

  <!-- CHECKING -->
  <div id="checkingView" class="checking">
    <div class="spinner"></div>
    <div>Verificando sessão...</div>
  </div>

  <!-- AUTH CARD -->
  <div id="authView" class="auth-card hidden">

    <div class="brand">
      <div class="brand-icon"><i data-lucide="notebook-pen"></i></div>
      <h1>Diário</h1>
      <p>Acompanhamento do dia a dia</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Entrar</button>
      <button class="tab-btn" data-tab="register">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="form active" autocomplete="on" novalidate>
      <div class="field" id="loginEmailField">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email" inputmode="email" required>
        <div class="field-error">E-mail inválido</div>
      </div>
      <div class="field" id="loginPasswordField">
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password" required>
        <div class="field-error">Senha obrigatória</div>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">
        <i data-lucide="log-in"></i>
        <span>Entrar</span>
      </button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="form" autocomplete="on" novalidate>
      <div class="field" id="regNameField">
        <label for="regName">Nome</label>
        <input type="text" id="regName" placeholder="Como te chamamos?" autocomplete="name" required>
        <div class="field-error">Nome obrigatório</div>
      </div>
      <div class="field" id="regEmailField">
        <label for="regEmail">E-mail</label>
        <input type="email" id="regEmail" placeholder="seu@email.com" autocomplete="email" inputmode="email" required>
        <div class="field-error">E-mail inválido</div>
      </div>
      <div class="field" id="regPasswordField">
        <label for="regPassword">Senha</label>
        <input type="password" id="regPassword" placeholder="mínimo 6 caracteres" autocomplete="new-password" required>
        <div class="field-error">Senha deve ter pelo menos 6 caracteres</div>
      </div>
      <button type="submit" class="btn-primary" id="registerBtn">
        <i data-lucide="user-plus"></i>
        <span>Criar conta</span>
      </button>
    </form>

    <div class="auth-footer">
      <button type="button" class="theme-btn" id="themeBtn">
        <i data-lucide="palette"></i>
        <span id="themeLabel">Dark</span>
      </button>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API_BASE = "https://luizback-y8qz.vercel.app";
const TOKEN_KEY = "luiz_token";
const USER_KEY = "luiz_user";
const THEME_KEY = "theme";
const TIMEOUT_MS = 15000;

/* ============================================================
   UTILS
   ============================================================ */
const $ = (id) => document.getElementById(id);
const refreshIcons = () => window.lucide && lucide.createIcons();

function log(...args) { console.log("%c[auth]", "color:#8b5cf6;font-weight:bold", ...args); }
function logErr(...args) { console.error("%c[auth]", "color:#ef4444;font-weight:bold", ...args); }

function toast(msg, type = "success") {
  const t = $("toast");
  const icon = type === "error" ? "alert-circle" : "check-circle";
  t.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeHtml(msg)}</span>`;
  t.classList.toggle("error", type === "error");
  refreshIcons();
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 3500);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

/* ============================================================
   TEMA
   ============================================================ */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem(THEME_KEY, theme);
  const colors = { dark: "#0a0a0f", light: "#f5f5f7", glass: "#0b0b14" };
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", colors[theme] || "#0a0a0f");
  const labels = { dark: "Dark", light: "Light", glass: "Glass" };
  const lbl = $("themeLabel");
  if (lbl) lbl.textContent = labels[theme] || "Dark";
}

function cycleTheme() {
  const order = ["dark", "light", "glass"];
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = order[(order.indexOf(current) + 1) % order.length];
  applyTheme(next);
  toast(`Tema: ${next}`);
}

(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || "dark";
  applyTheme(saved);
})();

/* ============================================================
   API — com timeout, log e tratamento explícito
   ============================================================ */
async function apiFetch(path, opts = {}) {
  const url = API_BASE + path;
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  const token = localStorage.getItem(TOKEN_KEY);
  if (token && !opts.noAuth) headers.Authorization = `Bearer ${token}`;

  const method = opts.method || "GET";
  log(`→ ${method} ${path}`, opts.body ? JSON.parse(opts.body) : "");

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

  let res;
  try {
    res = await fetch(url, { ...opts, headers, signal: ctrl.signal });
  } catch (netErr) {
    clearTimeout(timer);
    logErr("Falha de rede/timeout:", netErr);
    const err = new Error(
      netErr.name === "AbortError"
        ? "O servidor demorou demais pra responder"
        : "Sem conexão com o servidor"
    );
    err.status = 0;
    err.cause = netErr;
    throw err;
  }
  clearTimeout(timer);

  let data = null;
  const text = await res.text();
  if (text) {
    try { data = JSON.parse(text); }
    catch { data = { raw: text.slice(0, 500) }; }
  }

  log(`← ${res.status} ${method} ${path}`, data);

  if (!res.ok) {
    const msg =
      data?.error ||
      data?.message ||
      (res.status === 500 ? "Erro interno do servidor" : `Erro HTTP ${res.status}`);
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* ============================================================
   SESSION
   ============================================================ */
function saveSession(token, user) {
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(USER_KEY, JSON.stringify(user));
}
function clearSession() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  localStorage.removeItem("luiz_dependentId");
}
function getToken() { return localStorage.getItem(TOKEN_KEY); }

async function login(email, password) {
  const data = await apiFetch("/auth/login", {
    method: "POST",
    body: JSON.stringify({ email, password }),
    noAuth: true,
  });
  if (!data?.token || !data?.user) {
    logErr("Resposta inesperada do /auth/login:", data);
    throw new Error("Resposta inválida do servidor");
  }
  saveSession(data.token, data.user);
  return data.user;
}

async function register(name, email, password) {
  const data = await apiFetch("/auth/register", {
    method: "POST",
    body: JSON.stringify({ name, email, password }),
    noAuth: true,
  });
  if (!data?.token || !data?.user) {
    logErr("Resposta inesperada do /auth/register:", data);
    throw new Error("Resposta inválida do servidor");
  }
  saveSession(data.token, data.user);
  return data.user;
}

async function fetchMe() {
  return apiFetch("/auth/me");
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function setLoading(btnId, loading) {
  const btn = $(btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn._originalHTML = btn.innerHTML;
    btn.innerHTML = `<div class="spinner"></div><span>${btn.textContent.trim()}</span>`;
  } else if (btn._originalHTML) {
    btn.innerHTML = btn._originalHTML;
    delete btn._originalHTML;
    refreshIcons();
  }
}

function setFieldError(fieldId, hasError, message) {
  const el = $(fieldId);
  if (!el) return;
  el.classList.toggle("error", !!hasError);
  if (hasError && message) {
    const errEl = el.querySelector(".field-error");
    if (errEl) errEl.textContent = message;
  }
  if (hasError) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
  }
}

function clearAllErrors() {
  document.querySelectorAll(".field.error").forEach(f => f.classList.remove("error"));
}

/* ============================================================
   VALIDAÇÃO
   ============================================================ */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const validateEmail = (email) => EMAIL_RE.test(String(email).trim());

/* ============================================================
   TABS
   ============================================================ */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".form").forEach(f => {
      f.classList.toggle("active", f.id === tab + "Form");
    });
    clearAllErrors();
    const form = $(tab + "Form");
    const firstInput = form?.querySelector("input");
    if (firstInput) setTimeout(() => firstInput.focus(), 100);
  });
});

/* ============================================================
   LOGIN
   ============================================================ */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAllErrors();

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  let hasError = false;
  if (!validateEmail(email)) { setFieldError("loginEmailField", true, "E-mail inválido"); hasError = true; }
  if (!password) { setFieldError("loginPasswordField", true, "Senha obrigatória"); hasError = true; }
  if (hasError) { toast("Corrija os campos destacados", "error"); return; }

  setLoading("loginBtn", true);
  try {
    const user = await login(email, password);
    toast(`Bem-vindo, ${user.name.split(" ")[0]}!`);
    log("Login OK, redirecionando...");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 600);
  } catch (err) {
    setLoading("loginBtn", false);
    logErr("Erro no login:", err, err.data);

    if (err.status === 401) {
      setFieldError("loginEmailField", true, "");
      setFieldError("loginPasswordField", true, "");
      toast("E-mail ou senha incorretos", "error");
    } else if (err.status === 400) {
      toast(err.message || "Dados inválidos", "error");
    } else if (err.status === 500) {
      toast("Servidor com problema. Tente de novo em instantes.", "error");
    } else if (err.status === 0) {
      toast("Sem conexão com o servidor", "error");
    } else {
      toast(err.message || `Erro ${err.status}`, "error");
    }
  }
});

/* ============================================================
   REGISTER
   ============================================================ */
$("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAllErrors();

  const name = $("regName").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;

  let hasError = false;
  if (!name) { setFieldError("regNameField", true, "Nome obrigatório"); hasError = true; }
  if (!validateEmail(email)) { setFieldError("regEmailField", true, "E-mail inválido"); hasError = true; }
  if (!password || password.length < 6) { setFieldError("regPasswordField", true, "Mínimo 6 caracteres"); hasError = true; }
  if (hasError) { toast("Corrija os campos destacados", "error"); return; }

  setLoading("registerBtn", true);
  try {
    const user = await register(name, email, password);
    toast(`Conta criada! Bem-vindo, ${user.name.split(" ")[0]}`);
    log("Registro OK, redirecionando...");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
  } catch (err) {
    setLoading("registerBtn", false);
    logErr("Erro no registro:", err, err.data);

    if (err.status === 409) {
      setFieldError("regEmailField", true, "Esse e-mail já está cadastrado");
      toast("E-mail já cadastrado", "error");
    } else if (err.status === 400) {
      toast(err.message || "Dados inválidos", "error");
    } else if (err.status === 500) {
      toast("Servidor com problema. Tente de novo em instantes.", "error");
    } else if (err.status === 0) {
      toast("Sem conexão com o servidor", "error");
    } else {
      toast(err.message || `Erro ${err.status}`, "error");
    }
  }
});

/* ============================================================
   THEME
   ============================================================ */
$("themeBtn")?.addEventListener("click", cycleTheme);

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  refreshIcons();
  log("init — checando sessão");

  const token = getToken();
  if (!token) {
    log("Sem token, mostrando auth");
    $("checkingView").classList.add("hidden");
    $("authView").classList.remove("hidden");
    setTimeout(() => $("loginEmail")?.focus(), 200);
    return;
  }

  try {
    log("Token encontrado, validando em /auth/me");
    const { user } = await fetchMe();
    localStorage.setItem(USER_KEY, JSON.stringify(user));
    log("Token válido, indo pro dashboard");
    window.location.href = "dashboard.html";
  } catch (err) {
    logErr("Token inválido/expirado ou erro no servidor:", err, err.data);

    // 401: token expirado, limpa e mostra login
    // 500: servidor com problema, mostra login (não tem o que fazer)
    // 0: sem conexão, mostra login (vai tentar de novo quando logar)
    clearSession();
    $("checkingView").classList.add("hidden");
    $("authView").classList.remove("hidden");
    setTimeout(() => $("loginEmail")?.focus(), 200);

    if (err.status === 500) {
      toast("Servidor instável. Faça login novamente.", "error");
    }
  }
})();
</script>
