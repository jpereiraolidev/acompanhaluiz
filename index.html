<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1310">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="capa.png">
  <link rel="apple-touch-icon" href="capa.png">
  <title>Entrenós · Entrar</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Bibliotecas de ícones -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --radius: 16px;
      --radius-sm: 12px;
      --radius-lg: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --brand: #4ade9f;
      --brand-2: #34d399;
      --brand-3: #10b981;
      --brand-deep: #064e3b;
      --brand-glow: rgba(74, 222, 159, 0.28);

      --success: #4ade9f;
      --danger: #f87171;
      --warning: #fbbf24;
      --info: #38bdf8;
    }

    /* ============ TEMAS ============ */
    html[data-theme="dark"] {
      --bg: #0a1310; --bg-2: #0f1a16; --bg-3: #142420;
      --card: #101a17; --card-hover: #172722;
      --border: #1f332c; --border-soft: #182823;
      --text: #ecfdf5; --text-2: #a7c4ba; --text-3: #6b857c;
      --input-bg: #0c1613;
      --backdrop: rgba(0,0,0,0.6);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    html[data-theme="light"] {
      --bg: #f4faf7; --bg-2: #e8f3ee; --bg-3: #dceee6;
      --card: #ffffff; --card-hover: #f6fcf9;
      --border: #d0e5dc; --border-soft: #e2efe9;
      --text: #0a1a15; --text-2: #3f5a52; --text-3: #7a958c;
      --input-bg: #f4faf7;
      --backdrop: rgba(10, 26, 21, 0.35);
      --shadow: 0 12px 40px rgba(10, 26, 21, 0.08);
    }
    html[data-theme="glass"] {
      --bg: #071410;
      --bg-2: rgba(255,255,255,0.03);
      --card: rgba(20, 40, 34, 0.55);
      --card-hover: rgba(30, 55, 46, 0.65);
      --border: rgba(74, 222, 159, 0.15);
      --border-soft: rgba(74, 222, 159, 0.08);
      --text: #ecfdf5; --text-2: rgba(236, 253, 245, 0.72); --text-3: rgba(236, 253, 245, 0.45);
      --input-bg: rgba(0, 0, 0, 0.25);
      --backdrop: rgba(0,0,0,0.5);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Orbes flutuantes (glass) */
    html[data-theme="glass"] body::before,
    html[data-theme="glass"] body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }
    html[data-theme="glass"] body::before {
      width: 460px; height: 460px;
      top: -140px; left: -140px;
      background: radial-gradient(circle, #4ade9f 0%, transparent 70%);
      animation: orbFloat 20s ease-in-out infinite;
    }
    html[data-theme="glass"] body::after {
      width: 420px; height: 420px;
      bottom: -140px; right: -140px;
      background: radial-gradient(circle, #10b981 0%, transparent 70%);
      animation: orbFloat 26s ease-in-out infinite reverse;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 40px) scale(1.12); }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }

    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px; line-height: 1.5;
      overscroll-behavior-y: none;
      transition: background 0.4s ease, color 0.4s ease;
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(ellipse 80% 60% at top, rgba(74, 222, 159, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at bottom right, rgba(16, 185, 129, 0.06) 0%, transparent 55%),
        var(--bg);
    }
    html[data-theme="light"] body {
      background:
        radial-gradient(ellipse 80% 60% at top, rgba(74, 222, 159, 0.15) 0%, transparent 60%),
        var(--bg);
    }
    html[data-theme="glass"] body { background: var(--bg); }

    /* ============================================================
       SVGs DECORATIVOS DE FUNDO
       ============================================================ */
    .bg-decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-decor svg {
      position: absolute;
      opacity: 0.06;
      color: var(--brand);
      animation: floatSlow 30s ease-in-out infinite;
    }
    html[data-theme="light"] .bg-decor svg { opacity: 0.10; }
    html[data-theme="glass"] .bg-decor svg { opacity: 0.08; }

    .bg-decor .leaf-1  { width: 180px; top: 8%;  left: -40px; animation-delay: 0s; }
    .bg-decor .leaf-2  { width: 140px; top: 55%; right: -30px; animation-delay: -6s; transform: rotate(45deg); }
    .bg-decor .heart-1 { width: 90px;  top: 25%; right: 8%; animation-delay: -3s; }
    .bg-decor .heart-2 { width: 70px;  bottom: 15%; left: 12%; animation-delay: -9s; }
    .bg-decor .wave-1  { width: 400px; bottom: -60px; left: 50%; transform: translateX(-50%); opacity: 0.04; }
    .bg-decor .dot-1   { width: 24px;  top: 18%; left: 22%; opacity: 0.15; }
    .bg-decor .dot-2   { width: 16px;  bottom: 30%; right: 24%; opacity: 0.12; }
    .bg-decor .dot-3   { width: 32px;  top: 62%; left: 8%; opacity: 0.10; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-24px) rotate(6deg); }
    }

    /* ============ LAYOUT ============ */
    .auth-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
      position: relative; z-index: 1;
    }

    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      z-index: 2;
    }
    html[data-theme="glass"] .auth-card {
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ BRAND ============ */
    .brand {
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 68px; height: 68px; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .brand-icon::before {
      content: ''; position: absolute; inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--brand-glow) 0%, transparent 70%);
      opacity: 0.7; z-index: -1;
    }
    .brand-icon svg {
      width: 62px; height: 62px;
      filter: drop-shadow(0 4px 16px var(--brand-glow));
    }

    .brand h1 {
      margin: 0 0 6px;
      font-size: 26px; font-weight: 800;
      letter-spacing: -0.035em;
      background: linear-gradient(135deg, var(--text) 0%, var(--brand) 120%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p {
      margin: 0; font-size: 11px; color: var(--text-3);
      font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    }

    /* ============ TABS ============ */
    .tabs {
      display: flex; gap: 4px;
      background: var(--bg-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 4px; margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1; padding: 11px 8px;
      background: transparent; border: none; border-radius: 9px;
      font-family: inherit; font-size: 13.5px; font-weight: 700;
      color: var(--text-3); cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      color: #062a1e;
      background: var(--brand);
      box-shadow: 0 4px 14px var(--brand-glow);
    }

    /* ============ FORMS ============ */
    .form { display: none; animation: fadeUp 0.3s ease; }
    .form.active { display: block; }

    .field { margin-bottom: 15px; }
    .field label {
      display: block; font-size: 11px; color: var(--text-3);
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 7px;
    }

    /* Wrapper do input (para o botão de olho) */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      padding: 14px 15px;
      padding-right: 46px; /* espaço pro olho */
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px; color: var(--text);
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      -webkit-appearance: none; appearance: none;
    }
    .input-wrap input:focus {
      outline: none; border-color: var(--brand);
      background: var(--card);
      box-shadow: 0 0 0 3px var(--brand-glow);
    }
    .input-wrap input::placeholder { color: var(--text-3); }

    /* Botão do olho */
    .toggle-pass {
      position: absolute;
      right: 8px;
      width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--text-3);
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      padding: 0;
    }
    .toggle-pass:hover {
      color: var(--brand);
      background: rgba(74, 222, 159, 0.10);
    }
    .toggle-pass:active { transform: scale(0.92); }
    .toggle-pass svg { width: 18px; height: 18px; }

    .field-error {
      display: none; font-size: 11.5px; color: var(--danger);
      margin-top: 6px; font-weight: 600;
    }
    .field.error .input-wrap input {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.15);
    }
    .field.error .field-error { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .field.shake { animation: shake 0.4s ease; }

    /* Indicador de força da senha */
    .pw-strength {
      display: flex; gap: 4px; margin-top: 8px;
    }
    .pw-strength .bar {
      height: 3px; flex: 1;
      background: var(--border);
      border-radius: 2px;
      transition: background 0.3s ease;
    }
    .pw-strength[data-score="1"] .bar:nth-child(-n+1) { background: var(--danger); }
    .pw-strength[data-score="2"] .bar:nth-child(-n+2) { background: var(--warning); }
    .pw-strength[data-score="3"] .bar:nth-child(-n+3) { background: var(--brand-2); }
    .pw-strength[data-score="4"] .bar { background: var(--brand); }

    /* ============ BUTTON ============ */
    .btn-primary {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #062a1e; border: none; padding: 15px;
      border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 800;
      font-family: inherit; cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 6px 20px var(--brand-glow);
      letter-spacing: -0.01em;
      margin-top: 8px;
    }
    .btn-primary svg, .btn-primary i { width: 18px; height: 18px; font-size: 18px; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .btn-primary .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(6, 42, 30, 0.3);
      border-top-color: #062a1e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: calc(24px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #062a1e; padding: 13px 22px;
      border-radius: 100px;
      font-size: 13.5px; font-weight: 800;
      opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      box-shadow: 0 10px 28px rgba(0,0,0,0.4), 0 0 24px var(--brand-glow);
      display: flex; align-items: center; gap: 8px;
      max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast svg, .toast i { width: 16px; height: 16px; font-size: 16px; flex-shrink: 0; }
    .toast.error {
      background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
      color: #fff;
      box-shadow: 0 10px 28px rgba(0,0,0,0.4), 0 0 24px rgba(248, 113, 113, 0.35);
    }
    .toast span { white-space: normal; }

    /* ============ FOOTER ============ */
    .auth-footer {
      margin-top: 22px; text-align: center;
      font-size: 12px; color: var(--text-3);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .theme-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-3); font-family: inherit;
      font-size: 11.5px; font-weight: 700;
      padding: 6px 12px; border-radius: 100px;
      cursor: pointer; transition: all 0.15s;
    }
    .theme-btn:hover { border-color: var(--brand); color: var(--brand); }
    .theme-btn:active { transform: scale(0.95); }
    .theme-btn svg, .theme-btn i { width: 13px; height: 13px; font-size: 13px; }

    /* ============ CHECKING ============ */
    .checking {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: var(--text-3); font-size: 13px; font-weight: 600;
    }
    .checking .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border); border-top-color: var(--brand);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ============================================================
     SVGs DECORATIVOS DE FUNDO
     ============================================================ -->
<div class="bg-decor" aria-hidden="true">
  <!-- Folha 1 -->
  <svg class="leaf-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
  </svg>

  <!-- Folha 2 -->
  <svg class="leaf-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
  </svg>

  <!-- Coração 1 -->
  <svg class="heart-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
  </svg>

  <!-- Coração 2 -->
  <svg class="heart-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
  </svg>

  <!-- Onda -->
  <svg class="wave-1" viewBox="0 0 400 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M0 40 Q50 10, 100 40 T200 40 T300 40 T400 40"/>
    <path d="M0 60 Q50 30, 100 60 T200 60 T300 60 T400 60" opacity="0.5"/>
  </svg>

  <!-- Pontos -->
  <svg class="dot-1" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
  <svg class="dot-2" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
  <svg class="dot-3" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
</div>

<div class="auth-wrap">

  <!-- CHECKING -->
  <div id="checkingView" class="checking">
    <div class="spinner"></div>
    <div>Verificando sessão...</div>
  </div>

  <!-- AUTH CARD -->
  <div id="authView" class="auth-card hidden">

    <!-- BRAND -->
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M32 54s-18-11.5-18-24.5C14 21.5 20.5 16 28 16c2.8 0 5.4 1 7.4 2.7L32 21l-3.4-2.3"
                stroke="#4ade9f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M32 54s18-11.5 18-24.5C50 21.5 43.5 16 36 16c-2.8 0-5.4 1-7.4 2.7L32 21l3.4-2.3"
                stroke="#4ade9f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 32c0-6 4-10 8-10s8 4 8 10-4 12-8 14-8-8-8-14z"
                stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
        </svg>
      </div>
      <h1>Entrenós</h1>
      <p>Registre · Compartilhe · Evolua</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Entrar</button>
      <button class="tab-btn" data-tab="register">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="form active" autocomplete="on" novalidate>
      <div class="field" id="loginEmailField">
        <label for="loginEmail">E-mail</label>
        <div class="input-wrap">
          <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field-error">E-mail inválido</div>
      </div>

      <div class="field" id="loginPasswordField">
        <label for="loginPassword">Senha</label>
        <div class="input-wrap">
          <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" data-target="loginPassword" aria-label="Mostrar senha">
            <i data-lucide="eye"></i>
          </button>
        </div>
        <div class="field-error">Senha obrigatória</div>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <i data-lucide="log-in"></i>
        <span>Entrar</span>
      </button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="form" autocomplete="on" novalidate>
      <div class="field" id="regNameField">
        <label for="regName">Nome</label>
        <div class="input-wrap">
          <input type="text" id="regName" placeholder="Como te chamamos?" autocomplete="name" required>
        </div>
        <div class="field-error">Nome obrigatório</div>
      </div>

      <div class="field" id="regEmailField">
        <label for="regEmail">E-mail</label>
        <div class="input-wrap">
          <input type="email" id="regEmail" placeholder="seu@email.com" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field-error">E-mail inválido</div>
      </div>

      <div class="field" id="regPasswordField">
        <label for="regPassword">Senha</label>
        <div class="input-wrap">
          <input type="password" id="regPassword" placeholder="mínimo 6 caracteres" autocomplete="new-password" required>
          <button type="button" class="toggle-pass" data-target="regPassword" aria-label="Mostrar senha">
            <i data-lucide="eye"></i>
          </button>
        </div>
        <div class="pw-strength" id="regPwStrength" data-score="0">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <div class="field-error">Senha deve ter pelo menos 6 caracteres</div>
      </div>

      <div class="field" id="regConfirmField">
        <label for="regConfirm">Confirmar senha</label>
        <div class="input-wrap">
          <input type="password" id="regConfirm" placeholder="repita a senha" autocomplete="new-password" required>
          <button type="button" class="toggle-pass" data-target="regConfirm" aria-label="Mostrar senha">
            <i data-lucide="eye"></i>
          </button>
        </div>
        <div class="field-error">As senhas não coincidem</div>
      </div>

      <button type="submit" class="btn-primary" id="registerBtn">
        <i data-lucide="user-plus"></i>
        <span>Criar conta</span>
      </button>
    </form>

    <!-- FOOTER -->
    <div class="auth-footer">
      <button type="button" class="theme-btn" id="themeBtn">
        <i data-lucide="palette"></i>
        <span id="themeLabel">Dark</span>
      </button>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API_BASE = "https://luizback-y8qz.vercel.app";
const TOKEN_KEY = "luiz_token";
const USER_KEY = "luiz_user";
const THEME_KEY = "theme";
const TIMEOUT_MS = 15000;

/* ============================================================
   UTILS
   ============================================================ */
const $ = (id) => document.getElementById(id);
const refreshIcons = () => {
  if (window.lucide) lucide.createIcons();
};

function log(...args) { console.log("%c[entrenos]", "color:#4ade9f;font-weight:bold", ...args); }
function logErr(...args) { console.error("%c[entrenos]", "color:#f87171;font-weight:bold", ...args); }

function toast(msg, type = "success") {
  const t = $("toast");
  const icon = type === "error" ? "alert-circle" : "check-circle";
  t.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeHtml(msg)}</span>`;
  t.classList.toggle("error", type === "error");
  refreshIcons();
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 3500);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

/* ============================================================
   TEMA
   ============================================================ */
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem(THEME_KEY, theme);
  const colors = { dark: "#0a1310", light: "#f4faf7", glass: "#071410" };
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", colors[theme] || "#0a1310");
  const labels = { dark: "Dark", light: "Light", glass: "Glass" };
  const lbl = $("themeLabel");
  if (lbl) lbl.textContent = labels[theme] || "Dark";
}

function cycleTheme() {
  const order = ["dark", "light", "glass"];
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = order[(order.indexOf(current) + 1) % order.length];
  applyTheme(next);
  toast(`Tema: ${next}`);
}

(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || "dark";
  applyTheme(saved);
})();

/* ============================================================
   API
   ============================================================ */
async function apiFetch(path, opts = {}) {
  const url = API_BASE + path;
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  const token = localStorage.getItem(TOKEN_KEY);
  if (token && !opts.noAuth) headers.Authorization = `Bearer ${token}`;

  const method = opts.method || "GET";
  log(`→ ${method} ${path}`);

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

  let res;
  try {
    res = await fetch(url, { ...opts, headers, signal: ctrl.signal });
  } catch (netErr) {
    clearTimeout(timer);
    logErr("Falha de rede/timeout:", netErr);
    const err = new Error(
      netErr.name === "AbortError"
        ? "O servidor demorou demais pra responder"
        : "Sem conexão com o servidor"
    );
    err.status = 0;
    err.cause = netErr;
    throw err;
  }
  clearTimeout(timer);

  let data = null;
  const text = await res.text();
  if (text) {
    try { data = JSON.parse(text); }
    catch { data = { raw: text.slice(0, 500) }; }
  }

  log(`← ${res.status} ${method} ${path}`, data);

  if (!res.ok) {
    const msg = data?.error || data?.message ||
      (res.status === 500 ? "Erro interno do servidor" : `Erro HTTP ${res.status}`);
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

/* ============================================================
   SESSION
   ============================================================ */
function saveSession(token, user) {
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(USER_KEY, JSON.stringify(user));
}
function clearSession() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  localStorage.removeItem("luiz_dependentId");
}
function getToken() { return localStorage.getItem(TOKEN_KEY); }

async function login(email, password) {
  const data = await apiFetch("/auth/login", {
    method: "POST",
    body: JSON.stringify({ email, password }),
    noAuth: true,
  });
  if (!data?.token || !data?.user) {
    logErr("Resposta inesperada do /auth/login:", data);
    throw new Error("Resposta inválida do servidor");
  }
  saveSession(data.token, data.user);
  return data.user;
}

async function register(name, email, password) {
  const data = await apiFetch("/auth/register", {
    method: "POST",
    body: JSON.stringify({ name, email, password }),
    noAuth: true,
  });
  if (!data?.token || !data?.user) {
    logErr("Resposta inesperada do /auth/register:", data);
    throw new Error("Resposta inválida do servidor");
  }
  saveSession(data.token, data.user);
  return data.user;
}

async function fetchMe() {
  return apiFetch("/auth/me");
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function setLoading(btnId, loading) {
  const btn = $(btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn._originalHTML = btn.innerHTML;
    btn.innerHTML = `<div class="spinner"></div><span>${btn.textContent.trim()}</span>`;
  } else if (btn._originalHTML) {
    btn.innerHTML = btn._originalHTML;
    delete btn._originalHTML;
    refreshIcons();
  }
}

function setFieldError(fieldId, hasError, message) {
  const el = $(fieldId);
  if (!el) return;
  el.classList.toggle("error", !!hasError);
  if (hasError && message) {
    const errEl = el.querySelector(".field-error");
    if (errEl) errEl.textContent = message;
  }
  if (hasError) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
  }
}

function clearAllErrors() {
  document.querySelectorAll(".field.error").forEach(f => f.classList.remove("error"));
}

/* ============================================================
   TOGGLE DE SENHA (olho)
   ============================================================ */
document.querySelectorAll(".toggle-pass").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = $(btn.dataset.target);
    if (!input) return;
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    // Troca o ícone
    const icon = btn.querySelector("i, svg");
    if (icon) {
      icon.setAttribute("data-lucide", showing ? "eye" : "eye-off");
    }
    // Se for <i data-lucide>, precisa re-renderizar
    refreshIcons();
    btn.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
  });
});

/* ============================================================
   FORÇA DA SENHA
   ============================================================ */
function scorePassword(pw) {
  if (!pw) return 0;
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 10) score++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
  if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
  return score;
}

$("regPassword")?.addEventListener("input", (e) => {
  const score = scorePassword(e.target.value);
  const el = $("regPwStrength");
  if (el) el.setAttribute("data-score", String(score));
});

/* ============================================================
   VALIDAÇÃO
   ============================================================ */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const validateEmail = (email) => EMAIL_RE.test(String(email).trim());

/* ============================================================
   TABS
   ============================================================ */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".form").forEach(f => {
      f.classList.toggle("active", f.id === tab + "Form");
    });
    clearAllErrors();
    const form = $(tab + "Form");
    const firstInput = form?.querySelector("input");
    if (firstInput) setTimeout(() => firstInput.focus(), 100);
  });
});

/* ============================================================
   LOGIN
   ============================================================ */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAllErrors();

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  let hasError = false;
  if (!validateEmail(email)) { setFieldError("loginEmailField", true, "E-mail inválido"); hasError = true; }
  if (!password) { setFieldError("loginPasswordField", true, "Senha obrigatória"); hasError = true; }
  if (hasError) { toast("Corrija os campos destacados", "error"); return; }

  setLoading("loginBtn", true);
  try {
    const user = await login(email, password);
    toast(`Bem-vindo, ${user.name.split(" ")[0]}!`);
    log("Login OK, redirecionando...");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 600);
  } catch (err) {
    setLoading("loginBtn", false);
    logErr("Erro no login:", err, err.data);

    if (err.status === 401) {
      setFieldError("loginEmailField", true, "");
      setFieldError("loginPasswordField", true, "");
      toast("E-mail ou senha incorretos", "error");
    } else if (err.status === 400) {
      toast(err.message || "Dados inválidos", "error");
    } else if (err.status === 500 || err.status === 503) {
      toast("Servidor com problema. Tente de novo em instantes.", "error");
    } else if (err.status === 0) {
      toast("Sem conexão com o servidor", "error");
    } else {
      toast(err.message || `Erro ${err.status}`, "error");
    }
  }
});

/* ============================================================
   REGISTER
   ============================================================ */
$("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearAllErrors();

  const name = $("regName").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;
  const confirm = $("regConfirm").value;

  let hasError = false;
  if (!name) { setFieldError("regNameField", true, "Nome obrigatório"); hasError = true; }
  if (!validateEmail(email)) { setFieldError("regEmailField", true, "E-mail inválido"); hasError = true; }
  if (!password || password.length < 6) { setFieldError("regPasswordField", true, "Mínimo 6 caracteres"); hasError = true; }
  if (confirm !== password) { setFieldError("regConfirmField", true, "As senhas não coincidem"); hasError = true; }
  if (hasError) { toast("Corrija os campos destacados", "error"); return; }

  setLoading("registerBtn", true);
  try {
    const user = await register(name, email, password);
    toast(`Conta criada! Bem-vindo, ${user.name.split(" ")[0]}`);
    log("Registro OK, redirecionando...");
    setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
  } catch (err) {
    setLoading("registerBtn", false);
    logErr("Erro no registro:", err, err.data);

    if (err.status === 409) {
      setFieldError("regEmailField", true, "Esse e-mail já está cadastrado");
      toast("E-mail já cadastrado", "error");
    } else if (err.status === 400) {
      toast(err.message || "Dados inválidos", "error");
    } else if (err.status === 500 || err.status === 503) {
      toast("Servidor com problema. Tente de novo em instantes.", "error");
    } else if (err.status === 0) {
      toast("Sem conexão com o servidor", "error");
    } else {
      toast(err.message || `Erro ${err.status}`, "error");
    }
  }
});

/* ============================================================
   THEME
   ============================================================ */
$("themeBtn")?.addEventListener("click", cycleTheme);

/* ============================================================
   INIT
   ============================================================ */
(async function init() {
  refreshIcons();
  log("init — checando sessão");

  const token = getToken();
  if (!token) {
    log("Sem token, mostrando auth");
    $("checkingView").classList.add("hidden");
    $("authView").classList.remove("hidden");
    setTimeout(() => $("loginEmail")?.focus(), 200);
    return;
  }

  try {
    log("Token encontrado, validando em /auth/me");
    const { user } = await fetchMe();
    localStorage.setItem(USER_KEY, JSON.stringify(user));
    log("Token válido, indo pro dashboard");
    window.location.href = "dashboard.html";
  } catch (err) {
    logErr("Token inválido/expirado ou erro no servidor:", err, err.data);
    clearSession();
    $("checkingView").classList.add("hidden");
    $("authView").classList.remove("hidden");
    setTimeout(() => $("loginEmail")?.focus(), 200);
    if (err.status === 500 || err.status === 503) {
      toast("Servidor instável. Faça login novamente.", "error");
    }
  }
})();
</script>
</body>
</html>
