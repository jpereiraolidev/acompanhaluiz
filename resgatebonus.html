<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0508">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<title>Tigrinho Dourado · Resgatar Bônus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{--gold:#ffd700;--gold-3:#b8860b;--red:#d4261a;--bg:#0a0508;--text:#ffffff;--text-2:#d0c8b8;--text-3:#8a8070;--radius:14px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--font-title:'Cinzel',serif;--font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--font-body);color:var(--text);background:radial-gradient(ellipse at top,rgba(212,38,26,.18) 0%,transparent 55%),radial-gradient(ellipse at bottom,rgba(255,215,0,.10) 0%,transparent 55%),linear-gradient(180deg,#050205 0%,#0a0508 50%,#14080c 100%);background-attachment:fixed;line-height:1.4;min-height:100vh;padding-bottom:calc(30px + var(--safe-bottom));user-select:none;-webkit-user-select:none}
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + var(--safe-top)) 14px 12px;background:linear-gradient(180deg,rgba(5,2,5,.98) 0%,rgba(20,8,12,.9) 100%);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,215,0,.2)}
.icon-btn{width:40px;height:40px;border-radius:10px;background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.25);color:var(--gold);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{transform:scale(.9)}
.header-title{flex:1;text-align:center;min-width:0}
.header-title h1{font-family:var(--font-title);font-size:14px;font-weight:900;letter-spacing:.15em;background:linear-gradient(180deg,#ffe066 0%,#ffd700 50%,#b8860b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase}
.header-title p{font-size:9px;color:var(--text-3);letter-spacing:.15em;font-weight:700;text-transform:uppercase;margin-top:2px}

main{padding:14px;max-width:520px;margin:0 auto}

/* ===== CARDS DE SALDO ===== */
.balance-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.balance-card{background:linear-gradient(135deg,rgba(255,215,0,.15) 0%,rgba(212,38,26,.08) 100%);border:2px solid rgba(255,215,0,.4);border-radius:var(--radius);padding:12px 14px;position:relative;overflow:hidden}
.balance-card.bonus{border-color:rgba(34,197,94,.5);background:linear-gradient(135deg,rgba(34,197,94,.12) 0%,rgba(255,215,0,.08) 100%)}
.balance-card-label{font-size:9px;color:rgba(255,215,0,.75);text-transform:uppercase;letter-spacing:.15em;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.balance-card.bonus .balance-card-label{color:rgba(74,222,128,.85)}
.balance-card-value{font-family:var(--font-title);font-size:19px;font-weight:900;letter-spacing:-.02em;line-height:1;background:linear-gradient(180deg,#fff5cc 0%,#ffd700 50%,#b8860b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px}
.balance-card.bonus .balance-card-value{background:linear-gradient(180deg,#bbf7d0 0%,#4ade80 50%,#16a34a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.balance-card-value .cur{font-size:11px;-webkit-text-fill-color:currentColor}
.balance-card-icon{position:absolute;top:8px;right:10px;font-size:22px;opacity:.35}

/* ===== PROGRESSO GERAL ===== */
.progress-card{background:linear-gradient(135deg,rgba(255,215,0,.12) 0%,rgba(212,38,26,.08) 100%);border:1.5px solid rgba(255,215,0,.35);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-title{font-family:var(--font-title);font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,215,0,.9);display:flex;align-items:center;gap:6px}
.progress-stats{font-size:11px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.progress-bar{height:8px;background:rgba(0,0,0,.5);border-radius:100px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#ff5a3a,#ffd700,#ff8c00);border-radius:100px;transition:width .5s ease-out;box-shadow:0 0 12px rgba(255,215,0,.6)}
.progress-sub{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.55);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.progress-sub span:last-child{color:var(--gold)}

/* ===== SEÇÕES ===== */
.section-title{font-family:var(--font-title);font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,215,0,.85);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.section-title i{font-size:14px;color:var(--gold)}

/* ===== LISTA DE MISSÕES ===== */
.missions-list{display:flex;flex-direction:column;gap:10px}
.mission-item{background:linear-gradient(180deg,rgba(20,8,12,.95) 0%,rgba(5,2,5,.95) 100%);border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;transition:all .25s}
.mission-item.completed{border-color:rgba(34,197,94,.6);background:linear-gradient(180deg,rgba(34,197,94,.08) 0%,rgba(5,2,5,.95) 100%)}
.mission-item.claimed{border-color:rgba(255,255,255,.1);opacity:.5}
.mission-icon{width:44px;height:44px;border-radius:10px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);flex-shrink:0}
.mission-item.completed .mission-icon{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:#4ade80}
.mission-item.claimed .mission-icon{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.mission-body{flex:1;min-width:0}
.mission-title{font-size:13px;font-weight:900;color:#fff;margin-bottom:3px}
.mission-desc{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:6px}
.mission-progress-bar{height:4px;background:rgba(0,0,0,.5);border-radius:100px;overflow:hidden;margin-bottom:4px}
.mission-progress-fill{height:100%;background:linear-gradient(90deg,#ff8c00,#ffd700);border-radius:100px;transition:width .4s ease-out}
.mission-item.completed .mission-progress-fill{background:linear-gradient(90deg,#22c55e,#4ade80)}
.mission-progress-text{font-size:10px;color:rgba(255,215,0,.75);font-weight:800;font-variant-numeric:tabular-nums}
.mission-reward{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mission-reward-value{font-family:var(--font-title);font-size:14px;font-weight:900;background:linear-gradient(180deg,#fff5cc 0%,#ffd700 50%,#b8860b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums;white-space:nowrap}
.mission-claim-btn{padding:7px 12px;font-family:var(--font-title);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;background:linear-gradient(180deg,#22c55e 0%,#16a34a 100%);color:#fff;box-shadow:0 3px 0 #14532d,0 6px 16px rgba(34,197,94,.4);transition:all .15s;display:flex;align-items:center;gap:4px;animation:claimPulse 1.4s ease-in-out infinite}
@keyframes claimPulse{0%,100%{box-shadow:0 3px 0 #14532d,0 6px 16px rgba(34,197,94,.4)}50%{box-shadow:0 3px 0 #14532d,0 6px 24px rgba(34,197,94,.8)}}
.mission-claim-btn:active{transform:translateY(2px)}
.mission-claimed-label{font-size:10px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:4px}

/* ===== MINI-JOGO ===== */
.minigame-card{background:linear-gradient(135deg,rgba(212,38,26,.15) 0%,rgba(255,215,0,.10) 100%);border:2px solid rgba(255,215,0,.5);border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center;position:relative;overflow:hidden}
.minigame-card::before{content:'';position:absolute;top:-50%;left:-20%;width:180px;height:180px;background:radial-gradient(circle,rgba(255,215,0,.18) 0%,transparent 70%);pointer-events:none}
.minigame-title{font-family:var(--font-title);font-size:15px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;background:linear-gradient(180deg,#fff5cc 0%,#ffd700 50%,#b8860b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;position:relative}
.minigame-sub{font-size:11px;color:rgba(255,255,255,.65);margin-bottom:16px;position:relative}
.minigame-boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;position:relative}
.mg-box{aspect-ratio:1;border-radius:12px;background:linear-gradient(180deg,#2a0a12 0%,#14050a 100%);border:2px solid rgba(255,215,0,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;color:rgba(255,215,0,.3);transition:all .2s;position:relative;overflow:hidden}
.mg-box:hover:not(.opened){transform:translateY(-2px);border-color:var(--gold);box-shadow:0 6px 20px rgba(255,215,0,.3)}
.mg-box:active:not(.opened){transform:scale(.95)}
.mg-box.opened{cursor:default;background:linear-gradient(180deg,#1a0a05 0%,#0a0508 100%)}
.mg-box.winner{border-color:#4ade80;background:linear-gradient(180deg,rgba(34,197,94,.2) 0%,rgba(5,2,5,.95) 100%);color:#4ade80;animation:winnerPulse .6s ease-out}
@keyframes winnerPulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.mg-box.loser{border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.25)}
.mg-box i{font-size:32px}
.mg-result{font-family:var(--font-title);font-size:13px;font-weight:900;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;min-height:20px;position:relative}
.mg-result.win{color:var(--gold);font-size:16px;text-shadow:0 0 20px rgba(255,215,0,.6)}
.mg-result.lose{color:rgba(255,255,255,.4)}

/* Botão de resgatar bônus do mini-jogo */
.mg-play-btn{display:block;width:100%;padding:14px;font-family:var(--font-title);font-size:13px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#ffd700 0%,#b8860b 100%);color:#1a0a05;box-shadow:0 6px 0 #6b4f0a,0 10px 30px rgba(255,215,0,.35);transition:all .12s;margin-top:14px;position:relative}
.mg-play-btn:active:not(:disabled){transform:translateY(4px)}
.mg-play-btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4);box-shadow:0 6px 0 #4a4a4a,0 10px 30px rgba(0,0,0,.2)}
.mg-cooldown{font-size:10px;color:rgba(255,215,0,.6);letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-top:10px;position:relative}

/* ===== HISTÓRICO DE BÔNUS ===== */
.bonus-history{background:linear-gradient(180deg,rgba(20,8,12,.95) 0%,rgba(5,2,5,.95) 100%);border:1px solid rgba(255,215,0,.2);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.bonus-history-title{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,215,0,.7);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bonus-history-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
.bonus-history-list::-webkit-scrollbar{width:4px}
.bonus-history-list::-webkit-scrollbar-thumb{background:rgba(255,215,0,.3);border-radius:4px}
.bonus-history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(255,215,0,.04);border-radius:8px;font-size:11px}
.bonus-history-item .label{color:rgba(255,255,255,.65);display:flex;align-items:center;gap:6px}
.bonus-history-item .label i{color:#4ade80;font-size:11px}
.bonus-history-item .amount{font-weight:900;color:#4ade80;font-variant-numeric:tabular-nums}
.bonus-history-empty{text-align:center;color:rgba(255,255,255,.35);font-size:11px;padding:16px 0}

/* ===== BOTÃO PRINCIPAL ===== */
.main-action-btn{display:block;width:100%;padding:16px;font-family:var(--font-title);font-size:14px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#ff5a3a 0%,#8b0000 100%);color:#fff;box-shadow:0 6px 0 #4a0a00,0 10px 30px rgba(212,38,26,.35);transition:all .12s;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.main-action-btn:active{transform:translateY(4px)}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:calc(30px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,#ffd700 0%,#b8860b 100%);color:#1a0a05;padding:12px 22px;border-radius:100px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.56,.64,1);z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 30px rgba(255,215,0,.5);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:linear-gradient(135deg,#d4261a 0%,#8b0000 100%);color:#fff}

/* ===== OVERLAY DE RESGATE ===== */
.reward-overlay{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;padding:20px;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.75) 0%,rgba(0,0,0,.95) 100%)}
.reward-overlay.show{display:flex;pointer-events:auto;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.reward-content{text-align:center;animation:rewardScale .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes rewardScale{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.reward-icon{font-size:64px;color:var(--gold);margin-bottom:16px;filter:drop-shadow(0 0 30px rgba(255,215,0,1));animation:rewardBounce 1s ease-out infinite alternate}
@keyframes rewardBounce{from{transform:scale(1)}to{transform:scale(1.08)}}
.reward-label{font-family:var(--font-title);font-size:16px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,215,0,.9);margin-bottom:8px;text-shadow:0 0 24px rgba(255,215,0,.8)}
.reward-value{font-family:var(--font-title);font-size:clamp(48px,14vw,80px);font-weight:900;background:linear-gradient(180deg,#fff5cc 0%,#ffd700 50%,#b8860b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 16px rgba(255,215,0,.7));line-height:1;font-variant-numeric:tabular-nums}

/* ===== RESPONSIVO ===== */
@media (max-width:380px){
  .balance-card-value{font-size:17px}
  .mission-title{font-size:12px}
  .mission-desc{font-size:10px}
  .minigame-boxes{gap:8px}
  .mg-box{font-size:26px}
  .mg-box i{font-size:26px}
}
</style>
</head>
<body>

<header>
  <button class="icon-btn" onclick="goHome()"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="header-title">
    <h1>Resgatar Bônus</h1>
    <p>Missões & Recompensas</p>
  </div>
  <button class="icon-btn" onclick="forceRefresh()"><i class="fa-solid fa-rotate"></i></button>
</header>

<main>

  <!-- SALDOS -->
  <div class="balance-row">
    <div class="balance-card">
      <div class="balance-card-label"><i class="fa-solid fa-wallet"></i> Saldo</div>
      <div class="balance-card-value"><span class="cur">L$</span><span id="balanceCoins">0,00</span></div>
      <div class="balance-card-icon">💰</div>
    </div>
    <div class="balance-card bonus">
      <div class="balance-card-label"><i class="fa-solid fa-gift"></i> Bônus</div>
      <div class="balance-card-value"><span class="cur">L$</span><span id="balanceBonus">0,00</span></div>
      <div class="balance-card-icon">🎁</div>
    </div>
  </div>

  <!-- PROGRESSO GERAL -->
  <div class="progress-card">
    <div class="progress-header">
      <div class="progress-title"><i class="fa-solid fa-trophy"></i> Progresso</div>
      <div class="progress-stats" id="progressStats">0 / 12</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-sub">
      <span>Resgatado</span>
      <span id="progressClaimed">L$ 0,00</span>
    </div>
  </div>

  <!-- AÇÃO PRINCIPAL: IR PARA O JOGO -->
  <button class="main-action-btn" onclick="goToGame()">
    <i class="fa-solid fa-play"></i> Jogar para ganhar mais bônus
  </button>

  <!-- MISSÕES -->
  <div class="section-title"><i class="fa-solid fa-list-check"></i> Missões</div>
  <div class="missions-list" id="missionsList"></div>

  <!-- MINI-JOGO -->
  <div class="section-title"><i class="fa-solid fa-dice"></i> Bônus Diário</div>
  <div class="minigame-card">
    <div class="minigame-title">Escolha uma caixa</div>
    <div class="minigame-sub">1 prêmio garantido por dia</div>
    <div class="minigame-boxes" id="minigameBoxes"></div>
    <div class="mg-result" id="mgResult">Toque em uma caixa para abrir</div>
    <button class="mg-play-btn" id="mgPlayBtn" onclick="resetMinigame()" style="display:none;">
      <i class="fa-solid fa-rotate"></i> Jogar novamente amanhã
    </button>
    <div class="mg-cooldown" id="mgCooldown"></div>
  </div>

  <!-- HISTÓRICO DE BÔNUS -->
  <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Bônus recebidos</div>
  <div class="bonus-history">
    <div class="bonus-history-list" id="bonusHistoryList"></div>
  </div>

</main>

<div class="reward-overlay" id="rewardOverlay">
  <div class="reward-content">
    <div class="reward-icon" id="rewardIcon">🎁</div>
    <div class="reward-label" id="rewardLabel">BÔNUS</div>
    <div class="reward-value" id="rewardValue">L$ 0,00</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO DE MISSÕES
   ============================================================ */
const MISSIONS = [
  { id: "spins_10",     icon: "fa-dice",        title: "Primeiros Giros",     desc: "Dê 10 giros",                    target: 10,    reward: 200,   stat: "spins" },
  { id: "spins_50",     icon: "fa-dice-d6",     title: "Aqueceu a Máquina",   desc: "Dê 50 giros",                    target: 50,    reward: 1000,  stat: "spins" },
  { id: "spins_200",    icon: "fa-fire",        title: "Viciado",             desc: "Dê 200 giros",                   target: 200,   reward: 4000,  stat: "spins" },
  { id: "wins_1",       icon: "fa-star",        title: "Primeira Vitória",    desc: "Ganhe 1 rodada",                 target: 1,     reward: 100,   stat: "hits" },
  { id: "wins_20",      icon: "fa-trophy",      title: "Colecionador",        desc: "Ganhe 20 rodadas",               target: 20,    reward: 1500,  stat: "hits" },
  { id: "big_1",        icon: "fa-fire",        title: "Sorte Grande",        desc: "Consiga 1 BIG WIN",              target: 1,     reward: 2500,  stat: "bigWins" },
  { id: "mega_1",       icon: "fa-bolt",        title: "Sortudo",             desc: "Consiga 1 MEGA WIN",             target: 1,     reward: 6000,  stat: "megaWins" },
  { id: "super_1",      icon: "fa-crown",       title: "Lendário",            desc: "Consiga 1 SUPER GANHO",          target: 1,     reward: 15000, stat: "superWins" },
  { id: "wagered_50",   icon: "fa-coins",       title: "Apostador",           desc: "Aposte L$ 50 no total",          target: 5000,  reward: 500,   stat: "wagered" },
  { id: "wagered_500",  icon: "fa-sack-dollar", title: "Baleia",              desc: "Aposte L$ 500 no total",         target: 50000, reward: 4000,  stat: "wagered" },
  { id: "event_1",      icon: "fa-gift",        title: "Eventual",            desc: "Ative 1 evento especial",        target: 1,     reward: 2000,  stat: "events" },
  { id: "surprise_1",   icon: "fa-wand-magic-sparkles", title: "Multiplicado", desc: "Consiga 1 multiplicador surpresa", target: 1,    reward: 3000,  stat: "surprises" },
];

/* ============================================================
   MINI-JOGO — PRÊMIOS
   ============================================================ */
const MINIGAME_PRIZES = [
  { id: "p1", weight: 40, amount: 100,  icon: "fa-coins",        label: "L$ 1,00" },
  { id: "p2", weight: 25, amount: 250,  icon: "fa-coins",        label: "L$ 2,50" },
  { id: "p3", weight: 15, amount: 500,  icon: "fa-sack-dollar",  label: "L$ 5,00" },
  { id: "p4", weight: 12, amount: 1000, icon: "fa-gem",          label: "L$ 10,00" },
  { id: "p5", weight: 6,  amount: 2500, icon: "fa-crown",        label: "L$ 25,00" },
  { id: "p6", weight: 2,  amount: 5000, icon: "fa-trophy",       label: "L$ 50,00" },
];

const STORAGE_USERS = "cassino_users_v1";
const STORAGE_SESSION = "cassino_session_v1";
const STORAGE_MINIGAME = "cassino_minigame_v1";
const STORAGE_BONUS_HISTORY = "cassino_bonus_history_v1";

let currentUser = null;
let userGestureReceived = false;

const $ = (id) => document.getElementById(id);

/* ============================================================
   UTILS
   ============================================================ */
function formatCents(cents) {
  return (cents / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatInt(n) {
  return Number(n || 0).toLocaleString("pt-BR", { maximumFractionDigits: 0 });
}
function vibrate(ms = 12) {
  try {
    if (!userGestureReceived) return;
    if (typeof navigator === "undefined" || typeof navigator.vibrate !== "function") return;
    navigator.vibrate(ms);
  } catch (e) {}
}
function toast(msg, type = "success") {
  const el = $("toast"); if (!el) return;
  const icon = type === "error" ? "fa-circle-exclamation" : "fa-circle-check";
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove("show"), 2400);
}

/* ============================================================
   STORAGE
   ============================================================ */
function getUsers() { try { return JSON.parse(localStorage.getItem(STORAGE_USERS)) || []; } catch { return []; } }
function saveUsers(users) { localStorage.setItem(STORAGE_USERS, JSON.stringify(users)); }
function getSession() { return localStorage.getItem(STORAGE_SESSION); }
function clearSession() { localStorage.removeItem(STORAGE_SESSION); }

function updateCurrentUser(updates) {
  if (!currentUser) return;
  const users = getUsers();
  const idx = users.findIndex(u => u.id === currentUser.id);
  if (idx >= 0) { users[idx] = { ...users[idx], ...updates }; saveUsers(users); currentUser = users[idx]; }
}

function getMinigameState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_MINIGAME)) || {}; } catch { return {}; }
}
function saveMinigameState(state) {
  localStorage.setItem(STORAGE_MINIGAME, JSON.stringify(state));
}
function getBonusHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_BONUS_HISTORY)) || []; } catch { return []; }
}
function addBonusHistory(item) {
  const hist = getBonusHistory();
  hist.unshift(item);
  localStorage.setItem(STORAGE_BONUS_HISTORY, JSON.stringify(hist.slice(0, 30)));
}

/* ============================================================
   MISSÕES — LÓGICA
   ============================================================ */
function ensureMissionData() {
  if (!currentUser.missions) {
    updateCurrentUser({ missions: { progress: {}, claimed: {} } });
  }
}
function getMissionData() {
  if (!currentUser || !currentUser.missions) return { progress: {}, claimed: {} };
  return currentUser.missions;
}
function isMissionClaimable(mission) {
  const data = getMissionData();
  const prog = data.progress?.[mission.id] || 0;
  const claimed = data.claimed?.[mission.id] || false;
  return prog >= mission.target && !claimed;
}
function isMissionClaimed(mission) {
  const data = getMissionData();
  return data.claimed?.[mission.id] || false;
}

function claimMission(missionId) {
  const mission = MISSIONS.find(m => m.id === missionId);
  if (!mission) return;
  if (!isMissionClaimable(mission)) return;

  ensureMissionData();
  const data = getMissionData();
  const claimed = { ...(data.claimed || {}) };
  claimed[mission.id] = true;
  updateCurrentUser({ missions: { ...data, claimed } });

  // Credita no saldo principal
  updateCurrentUser({ coins: currentUser.coins + mission.reward });

  // Registra no histórico de bônus
  addBonusHistory({
    type: "mission",
    missionId: mission.id,
    label: `Missão: ${mission.title}`,
    amount: mission.reward,
    ts: Date.now(),
  });

  vibrate([80, 40, 120]);
  renderAll();
  showRewardOverlay("fa-trophy", "MISSÃO COMPLETA", mission.reward);
  toast(`+L$ ${formatCents(mission.reward)} · ${mission.title}`);
}

/* ============================================================
   MINI-JOGO — LÓGICA
   ============================================================ */
function rollMinigamePrize() {
  const total = MINIGAME_PRIZES.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of MINIGAME_PRIZES) {
    r -= p.weight;
    if (r <= 0) return p;
  }
  return MINIGAME_PRIZES[0];
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}

function canPlayMinigame() {
  const state = getMinigameState();
  return state.lastPlayDate !== getTodayKey();
}

function renderMinigame() {
  const boxesEl = $("minigameBoxes");
  const resultEl = $("mgResult");
  const playBtn = $("mgPlayBtn");
  const cooldownEl = $("mgCooldown");
  if (!boxesEl) return;

  const state = getMinigameState();
  const canPlay = canPlayMinigame();

  // Renderiza as 3 caixas
  if (state.openedToday) {
    // Mostra o resultado já aberto
    boxesEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const box = document.createElement("div");
      box.className = "mg-box opened " + (i === state.winnerIndex ? "winner" : "loser");
      box.innerHTML = i === state.winnerIndex
        ? `<i class="fa-solid ${state.prizeIcon}"></i>`
        : `<i class="fa-solid fa-xmark"></i>`;
      boxesEl.appendChild(box);
    }
    if (resultEl) {
      resultEl.textContent = `Você ganhou ${state.prizeLabel}!`;
      resultEl.className = "mg-result win";
    }
    if (playBtn) playBtn.style.display = "block";
    if (cooldownEl) {
      const now = new Date();
      const tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(0, 0, 0, 0);
      const diff = tomorrow - now;
      const hours = Math.floor(diff / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      cooldownEl.textContent = `Próximo bônus em ${hours}h ${mins}m`;
    }
  } else if (canPlay) {
    // Mostra as 3 caixas fechadas
    boxesEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const box = document.createElement("div");
      box.className = "mg-box";
      box.dataset.index = i;
      box.innerHTML = `<i class="fa-solid fa-gift"></i>`;
      box.onclick = () => openMinigameBox(i);
      boxesEl.appendChild(box);
    }
    if (resultEl) {
      resultEl.textContent = "Toque em uma caixa para abrir";
      resultEl.className = "mg-result";
    }
    if (playBtn) playBtn.style.display = "none";
    if (cooldownEl) cooldownEl.textContent = "";
  } else {
    // Cooldown, mas sem histórico de hoje (fallback)
    boxesEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const box = document.createElement("div");
      box.className = "mg-box opened loser";
      box.innerHTML = `<i class="fa-solid fa-lock"></i>`;
      boxesEl.appendChild(box);
    }
    if (resultEl) resultEl.textContent = "Volte amanhã!";
    if (playBtn) playBtn.style.display = "none";
  }
}

function openMinigameBox(index) {
  if (!canPlayMinigame()) return;
  const prize = rollMinigamePrize();

  const state = getMinigameState();
  state.lastPlayDate = getTodayKey();
  state.openedToday = true;
  state.winnerIndex = index;
  state.prizeAmount = prize.amount;
  state.prizeIcon = prize.icon;
  state.prizeLabel = prize.label;
  saveMinigameState(state);

  // Credita bônus
  updateCurrentUser({ coins: currentUser.coins + prize.amount });
  addBonusHistory({
    type: "minigame",
    label: `Bônus diário · Caixa ${index + 1}`,
    amount: prize.amount,
    ts: Date.now(),
  });

  vibrate([100, 50, 150]);
  renderAll();
  showRewardOverlay(prize.icon, "BÔNUS DIÁRIO", prize.amount);
  toast(`+L$ ${formatCents(prize.amount)}`);
}

function resetMinigame() {
  toast("Você já jogou hoje. Volte amanhã!", "error");
}

/* ============================================================
   OVERLAY DE RECOMPENSA
   ============================================================ */
function showRewardOverlay(icon, label, amountCents) {
  const overlay = $("rewardOverlay");
  const iconEl = $("rewardIcon");
  const labelEl = $("rewardLabel");
  const valueEl = $("rewardValue");
  if (!overlay) return;

  if (iconEl) iconEl.innerHTML = `<i class="fa-solid ${icon}"></i>`;
  if (labelEl) labelEl.textContent = label;
  if (valueEl) valueEl.textContent = "+L$ " + formatCents(amountCents);

  overlay.classList.add("show");
  if (typeof confetti === "function") {
    confetti({
      particleCount: 50,
      spread: 90,
      origin: { y: 0.5 },
      colors: ["#ffd700", "#f5c542", "#b8860b", "#ff8c00"],
      scalar: 0.9,
      gravity: 0.5,
      ticks: 180,
      shapes: ["circle"],
      opacity: 0.7,
    });
  }
  setTimeout(() => overlay.classList.remove("show"), 1800);
}

/* ============================================================
   RENDER GERAL
   ============================================================ */
function renderBalance() {
  const coins = currentUser?.coins || 0;
  const el = $("balanceCoins");
  if (el) el.textContent = formatCents(coins);
}

function renderBonusBalance() {
  // Soma de todos os bônus recebidos (não gastos)
  const hist = getBonusHistory();
  const total = hist.reduce((s, h) => s + (h.amount || 0), 0);
  const el = $("balanceBonus");
  if (el) el.textContent = formatCents(total);
}

function renderProgress() {
  const data = getMissionData();
  const claimed = data.claimed || {};
  const totalClaimed = MISSIONS.filter(m => claimed[m.id]).length;
  const totalMissions = MISSIONS.length;

  const statsEl = $("progressStats");
  const fillEl = $("progressFill");
  const claimedEl = $("progressClaimed");

  if (statsEl) statsEl.textContent = `${totalClaimed} / ${totalMissions}`;
  if (fillEl) fillEl.style.width = ((totalClaimed / totalMissions) * 100) + "%";

  if (claimedEl) {
    const claimedValue = MISSIONS.filter(m => claimed[m.id]).reduce((s, m) => s + m.reward, 0);
    claimedEl.textContent = "L$ " + formatCents(claimedValue);
  }
}

function renderMissions() {
  const listEl = $("missionsList");
  if (!listEl) return;

  const data = getMissionData();
  const progress = data.progress || {};

  let html = "";
  for (const m of MISSIONS) {
    const currentVal = progress[m.id] || 0;
    const capped = Math.min(currentVal, m.target);
    const pct = Math.min(100, (capped / m.target) * 100);
    const isClaimed = isMissionClaimed(m);
    const isDone = currentVal >= m.target;
    const canClaim = isMissionClaimable(m);

    const stateClass = isClaimed ? "claimed" : (isDone ? "completed" : "");
    const rewardLabel = "L$ " + formatCents(m.reward);

    let actionHtml = "";
    if (isClaimed) {
      actionHtml = `<div class="mission-claimed-label"><i class="fa-solid fa-check"></i> Resgatado</div>`;
    } else if (canClaim) {
      actionHtml = `<button class="mission-claim-btn" onclick="claimMission('${m.id}')"><i class="fa-solid fa-gift"></i> Resgatar</button>`;
    } else {
      actionHtml = `<div class="mission-claimed-label">${Math.floor(pct)}%</div>`;
    }

    let progressText;
    if (m.stat === "wagered") {
      progressText = `L$ ${formatCents(capped)} / L$ ${formatCents(m.target)}`;
    } else {
      progressText = `${capped} / ${m.target}`;
    }

    html += `
      <div class="mission-item ${stateClass}">
        <div class="mission-icon"><i class="fa-solid ${m.icon}"></i></div>
        <div class="mission-body">
          <div class="mission-title">${m.title}</div>
          <div class="mission-desc">${m.desc}</div>
          <div class="mission-progress-bar">
            <div class="mission-progress-fill" style="width:${pct}%"></div>
          </div>
          <div class="mission-progress-text">${progressText}</div>
        </div>
        <div class="mission-reward">
          <div class="mission-reward-value">${rewardLabel}</div>
          ${actionHtml}
        </div>
      </div>
    `;
  }

  listEl.innerHTML = html;
}

function renderBonusHistory() {
  const listEl = $("bonusHistoryList");
  if (!listEl) return;
  const hist = getBonusHistory();

  if (hist.length === 0) {
    listEl.innerHTML = `<div class="bonus-history-empty"><i class="fa-solid fa-inbox"></i> Nenhum bônus recebido ainda</div>`;
    return;
  }

  listEl.innerHTML = hist.slice(0, 20).map(h => {
    const icon = h.type === "mission" ? "fa-trophy" : "fa-dice";
    return `
      <div class="bonus-history-item">
        <div class="label"><i class="fa-solid ${icon}"></i> ${h.label}</div>
        <div class="amount">+L$ ${formatCents(h.amount)}</div>
      </div>
    `;
  }).join("");
}

function renderAll() {
  renderBalance();
  renderBonusBalance();
  renderProgress();
  renderMissions();
  renderMinigame();
  renderBonusHistory();
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function goHome() {
  vibrate(10);
  window.location.href = "home.html";
}
function goToGame() {
  vibrate(10);
  window.location.href = "tigrinho.html";
}
function forceRefresh() {
  renderAll();
  toast("Atualizado");
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  const sessionId = getSession();
  if (!sessionId) { window.location.replace("index.html"); return; }

  const users = getUsers();
  const user = users.find(u => u.id === sessionId);
  if (!user) { clearSession(); window.location.replace("index.html"); return; }

  currentUser = user;
  if (typeof currentUser.coins !== "number") {
    currentUser.coins = 1000;
    updateCurrentUser({ coins: 1000 });
  }
  ensureMissionData();

  renderAll();

  // Marca gesto do usuário para vibrate
  const markGesture = () => {
    userGestureReceived = true;
    document.removeEventListener("touchstart", markGesture);
    document.removeEventListener("click", markGesture);
  };
  document.addEventListener("touchstart", markGesture, { once: true });
  document.addEventListener("click", markGesture, { once: true });

  // Re-renderiza a cada 30s para atualizar cooldown do mini-jogo
  setInterval(renderMinigame, 30000);

  console.log("%c🎁 Tigrinho · Resgatar Bônus", "color:#ffd700;font-size:16px;font-weight:900;");
  console.log("Usuário:", currentUser.username, "| L$:", currentUser.coins);
  console.log("Missões:", MISSIONS.length);
  console.log("Pode jogar mini-jogo hoje?", canPlayMinigame() ? "SIM" : "NÃO");
})();
</script>
</body>
</html>
